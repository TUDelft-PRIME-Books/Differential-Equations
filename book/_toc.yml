# Configuration of _toc.yml file is explained in detail here: https://jupyterbook.org/en/stable/structure/toc.html and https://sphinx-external-toc.readthedocs.io/en/latest/user_guide/sphinx.html

format: jb-book
root: index.md

parts:
  - caption: Front matter
    numbered: False
    chapters:
    - file: introduction.md
  - caption: Transformations
    chapters:
    - file: Transformations/fourier_transform.md
  - caption: Back matter
    numbered: False
    chapters:
    - file: references.md
    - file: credits.md
    - file: genindex.md